name: Karate Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      testTag:
        description: "Tag de Karate a ejecutar, por ejemplo @smoke o @GH-1"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        id: test_execution
        run: |
          tag="${{ github.event.inputs.testTag }}"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            tag="@smoke"
          fi

          if [ -n "$tag" ] && [ "${tag#@}" = "$tag" ]; then
            tag="@$tag"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ -n "$tag" ]; then
            ./gradlew clean test --no-daemon --console=plain -Dkarate.options="--tags $tag"
          else
            ./gradlew clean test --no-daemon --console=plain
          fi

      - name: Upload Karate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports
          path: target/karate-reports

      - name: Upload Gradle test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-report
          path: build/reports/tests/test

      - name: Comment issue result
        if: always() && github.event_name == 'workflow_dispatch' && contains(steps.test_execution.outputs.tag, '@GH-')
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.test_execution.outputs.tag }}';
            const match = tag.match(/@GH-(\d+)/);
            if (!match) return;

            const issue_number = Number(match[1]);
            const passed = '${{ job.status }}' === 'success';
            const status = passed ? 'PASSED' : 'FAILED';
            const labelToAdd = passed ? 'automated-passed' : 'automated-failed';
            const labelToRemove = passed ? 'automated-failed' : 'automated-passed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `Resultado automatizado para ${tag}: ${status}\n\nRun: ${runUrl}`
            });

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                name: labelToRemove
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: [labelToAdd]
            });
